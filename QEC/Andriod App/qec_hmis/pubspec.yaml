name: qec_hmis
description: Quaid Educational Complex - Higher Management Information System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Network
  dio: ^5.7.0

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI
  shimmer: ^3.0.0
  fl_chart: ^0.70.2

  # Utils
  dartz: ^0.10.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
