name: qec_hmis
description: Quaid Educational Complex - Higher Management Information System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Network
  dio: ^5.7.0

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.1
  cloud_firestore: ^5.6.5

  # UI
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  lottie: ^3.3.1

  # Utils
  dartz: ^0.10.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.2
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  open_file: ^3.5.10
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  equatable: ^2.0.7
  logger: ^2.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
